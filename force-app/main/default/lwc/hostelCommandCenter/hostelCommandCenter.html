<template>

    <div class="dashboard-container">

        <!-- Header -->
        <div class="header">
            <h1>🏠 Smart Hostel Command Center</h1>
            <p>College Hostel Management System</p>
        </div>

        <!-- KPI Cards -->
        <div class="cards-container">

            <div class="card">
                <div class="icon">👨</div>
                <div class="details">
                    <h2>Total Students</h2>
                    <p>{totalStudents}</p>
                </div>
            </div>

            <div class="card">
                <div class="icon">🛏️</div>
                <div class="details">
                    <h2>Available Rooms</h2>
                    <p>{availableRooms}</p>
                </div>
            </div>

            <div class="card">
                <div class="icon">⚠️</div>
                <div class="details">
                    <h2>Pending Complaints</h2>
                    <p>{pendingComplaints}</p>
                </div>
            </div>

            <div class="card">
                <div class="icon">🍽️</div>
                <div class="details">
                    <h2>Food Tokens</h2>
                    <p>{foodTokens}</p>
                </div>
            </div>

        </div>

        <!-- Recent Complaints -->

        <div class="section">

            <h2>📋 Recent Complaints</h2>

            <table class="complaint-table">

                <thead>

                    <tr>

                        <th>Student</th>

                        <th>Category</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

                    <template for:each={complaints} for:item="item">

                        <tr key={item.id}>

                            <td>{item.student}</td>

                            <td>{item.category}</td>

                            <td>{item.status}</td>

                        </tr>

                    </template>

                </tbody>

            </table>

        </div>

        <!-- Today's Menu -->

        <div class="section">

            <h2>🍽 Today's Menu</h2>

            <ul class="menu-list">

                <template for:each={todayMenu} for:item="menu">

                    <li key={menu.id}>{menu.name}</li>

                </template>

            </ul>

        </div>

        <!-- Quick Actions -->

        <div class="actions">

            <button>Allocate Room</button>

            <button>Book Food</button>

            <button>Visitor Entry</button>

            <button>Raise Complaint</button>

        </div>

    </div>

</template>
