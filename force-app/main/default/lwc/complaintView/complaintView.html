<template>
    <div class="view-content-anim">
        <div class="custom-card">
            <div class="card-header">
                <div class="header-left">
                    <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                    <h2>Complaints & Grievances Center</h2>
                    <span class="slds-badge slds-theme_warning">Total: {complaints.length}</span>
                </div>
                <button class="slds-button slds-button_brand" onclick={handleNewComplaint}>+ Log Complaint</button>
            </div>
            <div class="card-body">
                <template if:true={complaints.length}>
                    <div class="table-responsive">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Complaint ID</th>
                                    <th>Student</th>
                                    <th>Category</th>
                                    <th>Priority</th>
                                    <th>Description</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={complaints} for:item="c">
                                    <tr key={c.id}>
                                        <td><strong>{c.complaintId}</strong></td>
                                        <td>{c.studentName}</td>
                                        <td>{c.category}</td>
                                        <td><span class={c.priorityClass}>{c.priority}</span></td>
                                        <td>{c.description}</td>
                                        <td><span class={c.statusClass}>{c.status}</span></td>
                                        <td>
                                            <template if:true={c.isPending}>
                                                <button class="slds-button slds-button_success slds-button_x-small" data-id={c.id} onclick={handleResolve}>Resolve</button>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
