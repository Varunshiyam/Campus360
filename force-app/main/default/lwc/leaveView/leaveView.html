<template>
    <div class="view-content-anim">
        <div class="custom-card">
            <div class="card-header">
                <div class="header-left">
                    <lightning-icon icon-name="utility:event" size="small"></lightning-icon>
                    <h2>Leave & Outing Requests Queue</h2>
                    <span class="slds-badge slds-theme_warning">Total: {leaves.length}</span>
                </div>
            </div>
            <div class="card-body">
                <template if:true={leaves.length}>
                    <div class="table-responsive">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Leave ID</th>
                                    <th>Student Name</th>
                                    <th>From Date</th>
                                    <th>To Date</th>
                                    <th>Destination</th>
                                    <th>Reason</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={leaves} for:item="l">
                                    <tr key={l.id}>
                                        <td><strong>{l.name}</strong></td>
                                        <td>{l.studentName}</td>
                                        <td>{l.fromDate}</td>
                                        <td>{l.toDate}</td>
                                        <td>{l.destination}</td>
                                        <td>{l.reason}</td>
                                        <td><span class="status-pill status-pending">{l.status}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
