<template>
    <lightning-card title="Leave Requests" icon-name="standard:service_appointment">
        <div class="slds-p-around_medium">
            <template if:true={loading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <lightning-combobox
                label="Leave Type"
                value={leaveType}
                options={leaveTypeOptions}
                onchange={handleInputChange}
                data-id="leaveType"
                required
            ></lightning-combobox>
            <div class="slds-grid slds-gutters slds-m-top_x-small">
                <div class="slds-col">
                    <lightning-input 
                        type="date" 
                        label="From Date" 
                        value={fromDate}
                        onchange={handleInputChange} 
                        data-id="fromDate"
                        required
                    ></lightning-input>
                </div>
                <div class="slds-col">
                    <lightning-input 
                        type="date" 
                        label="To Date" 
                        value={toDate}
                        onchange={handleInputChange} 
                        data-id="toDate"
                        required
                    ></lightning-input>
                </div>
            </div>
            <lightning-textarea 
                label="Reason" 
                value={reason}
                onchange={handleInputChange} 
                data-id="reason"
                required
            ></lightning-textarea>
            <div class="actions slds-m-top_medium">
                <lightning-button label="Submit Leave" variant="brand" onclick={handleSubmit}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
