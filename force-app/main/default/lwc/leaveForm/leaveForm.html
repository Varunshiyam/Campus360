<template>
    <lightning-card title="Leave Application Form" icon-name="standard:absence">
        <div class="slds-p-around_medium">
            <lightning-input 
                type="text" 
                label="Driver Name" 
                name="driverName" 
                value={driverName} 
                onchange={handleChange} 
                required>
            </lightning-input>

            <lightning-input 
                type="date" 
                label="Start Date" 
                name="startDate" 
                value={startDate} 
                onchange={handleChange} 
                required>
            </lightning-input>

            <lightning-input 
                type="date" 
                label="End Date" 
                name="endDate" 
                value={endDate} 
                onchange={handleChange} 
                required>
            </lightning-input>

            <lightning-textarea 
                label="Reason" 
                name="reason" 
                value={reason} 
                onchange={handleChange} 
                required>
            </lightning-textarea>

            <div class="slds-m-top_medium">
                <lightning-button 
                    variant="brand" 
                    label="Submit Leave" 
                    title="Submit Leave" 
                    onclick={handleSubmit} 
                    class="slds-m-left_x-small">
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
